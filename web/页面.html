<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>问笔记</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  input { width: 68%; padding: 8px; font-size: 16px; }
  button { padding: 8px 16px; font-size: 16px; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; min-height: 60px; }
  .打盹提示 { color: #888; font-size: 13px; margin: -8px 0 16px; }
</style>
</head>
<body>
  <h1>问笔记</h1>
  <!--
    这句是给「免费档会打盹」写的。
    线上服务闲着会被挂起，有人点它才醒 —— 第一下可能要等十几秒。
    不提前说一句，面试官会以为网址挂了、直接关掉。
  -->
  <p class="打盹提示">第一次打开可能要等十几秒 —— 那是它在“醒”，不是坏了。</p>
  <input id="问题框" placeholder="想问什么…">
  <button id="问按钮">问</button>
  <pre id="答案区"></pre>

<script>
  // ─────────────────────────────────────────────────────────────
  // 给学过 Python、没写过 JS 的人看的一张对照表：
  //
  //     Python                    JS
  //     ─────────────────────     ─────────────────────────
  //     "字符串"                   "字符串"            （一样）
  //     变量直接写                 变量前面要加 const
  //     requests.post(...)        fetch(...)         （同一件事）
  //     json.dumps(...)           JSON.stringify(...)（同一件事）
  //     json.loads(...)           .json()            （同一件事）
  //     d["答案"]                 d.答案              （都是取那一栏）
  //     try / except              if (响应.ok === false)（都得先看牌子）
  // ─────────────────────────────────────────────────────────────

  // 先把页面上三样东西抓过来（各有 id，按名字认）
  const 问题框 = document.getElementById("问题框");
  const 问按钮 = document.getElementById("问按钮");
  const 答案区 = document.getElementById("答案区");

  // ─────────────────────────────────────────────────────────────
  // 🆕 第 13 课 · TODO ③：把 fetch 换成 EventSource（边收边打）
  //
  //   下面这段 async/await 是老的「整箱到货」写法 —— 保留着当对照。
  //   做完 服务.py 的 /问流 之后，把 问按钮.onclick 换成：
  //
  //     问按钮.onclick = () => {
  //       答案区.textContent = "";
  //       const 源 = new EventSource("/问流?问题=" + encodeURIComponent(问题框.value));
  //
  //       源.onmessage = (事件) => {
  //         if (事件.data === "[DONE]") { 源.close(); return; }   // 关闸
  //         答案区.textContent += JSON.parse(事件.data).字;
  //       };
  //
  //       源.onerror = () => { 源.close(); };
  //     };
  //
  //   ⚠️ 标点全用英文半角
  //   ⚠️ [DONE] 一定要 源.close() —— 不关它过一会儿会自动重连，同一个问题再问一遍
  //   ⚠️ EventSource 只能发 GET，所以问题塞在网址后面（encodeURIComponent 管中文）
  // ─────────────────────────────────────────────────────────────

  // 点「问」按钮时干这些事（老写法，先别删：留着对照）。
  // async / await 理解成「等它回来」：发请求要花时间，await = 在这一行等。
    问按钮.onclick = () => {
      答案区.textContent = "";
      const 源 = new EventSource("/问流?问题=" + encodeURIComponent(问题框.value));

      源.onmessage = (事件) => {
        if (事件.data === "[DONE]") { 源.close(); return; }   // 关闸
        答案区.textContent += JSON.parse(事件.data).字;
      };

      源.onerror = () => { 源.close(); };
    };
</script>
</body>
</html>
